<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Arvo</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf6ef;
        color: #1c1b19;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .symbol {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
        color: rgba(28, 27, 25, 0.65);
        margin: 0 0 24px;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: #c4501c;
        color: #faf6ef;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="symbol" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arvo">
        <g fill="#C4501C">
          <rect x="23.5" y="5.5" width="53" height="9" rx="4.5"></rect>
          <rect x="10.3" y="18.5" width="79.4" height="9" rx="4.5"></rect>
          <rect x="4.1" y="31.5" width="91.8" height="9" rx="4.5"></rect>
          <rect x="2" y="45.5" width="36" height="9" rx="4.5"></rect>
          <rect x="62" y="45.5" width="36" height="9" rx="4.5"></rect>
          <rect x="4.1" y="58.5" width="91.8" height="9" rx="4.5"></rect>
          <rect x="10.3" y="71.5" width="79.4" height="9" rx="4.5"></rect>
          <rect x="23.5" y="84.5" width="53" height="9" rx="4.5"></rect>
        </g>
      </svg>
      <h1>Sem conexão com a internet</h1>
      <p>Essa página precisa de conexão pra carregar. Verifique o sinal e tente de novo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
